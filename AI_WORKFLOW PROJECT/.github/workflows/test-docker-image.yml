name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start API server
        run: |
          python app.py &
          for i in $(seq 1 30); do curl -sf http://0.0.0.0:8080/ping && break; sleep 1; done
      - name: Run unit tests
        run: python run-tests.py

  docker:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ai-workflow-capstone:$(date +%s)
